seed_everything: 1234
trainer:
  accelerator: auto
  strategy: auto
  devices: auto
  num_nodes: 1
  precision: 32-true
  logger: null
  callbacks: null
  fast_dev_run: false
  max_epochs: 250
  min_epochs: null
  max_steps: -1
  min_steps: null
  max_time: null
  limit_train_batches: null
  limit_val_batches: null
  limit_test_batches: null
  limit_predict_batches: null
  overfit_batches: 0.0
  val_check_interval: null
  check_val_every_n_epoch: 1
  num_sanity_val_steps: null
  log_every_n_steps: null
  enable_checkpointing: null
  enable_progress_bar: null
  enable_model_summary: null
  accumulate_grad_batches: 1
  gradient_clip_val: null
  gradient_clip_algorithm: null
  deterministic: null
  benchmark: null
  inference_mode: true
  use_distributed_sampler: true
  profiler: null
  detect_anomaly: false
  barebones: false
  plugins: null
  sync_batchnorm: false
  reload_dataloaders_every_n_epochs: 0
  default_root_dir: lightning_logs/aleatoric_cip_conflow/TinyImagenet/SVGP/WRN28_10
model:
  name: SVDKL
  use_defaults: false
  model_params: 
    name: WideResNet_28_10
    args: 
      num_classes: 200
      shortcut_with_bn: -1
      track_running_stats: true
      with_classifier: false
      preact: true
      bias: false
      sp_norm_p: [3.0, 3.0]
      input_ds: tiny_imagenet
  gaussian_process_params:
     name: GridVariational
     grid_bounds: [-10.0, 10.0]
     grid_size: 64
  loss_params:
    name: Softmax
    mixing_weights: true
  optim_params:
    name: SGD
    num_likelihood_samples: [16, 320]
    args: 
      lr: 0.0002
      momentum: 0.9
      nesterov: true
      feature_extractor:
        weight_decay: 5.0e-4
      gaussian_process:
        hyperparameter:
          lr: 0.0001
  scheduler_params:
    scheduler_type: cosine
    initial_lr: 0.0002
    scale_by_batch_size: 200.0
    decay_epochs: 250
    warm_up_epochs: 8
  n_train_samples: 95000
  mixup_cutmix_alphas: [0.0, 0.0]
data:
  batch_size: 64
  num_workers_train: 10
  num_workers_test: 10
  normalize: true
  transform: Base
  image_size: 64
  test_batch_size: null
  insert_corrupted_data: true

